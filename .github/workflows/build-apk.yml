name: Build HT SelectorGuard v2.6 Phone and Watch8

on:
  workflow_dispatch:
  push:
    paths:
      - 'HT_SelectorGuard_v2_6_Notification_DirectMatch_Fix_OneUpload.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unzip v2.6 complete source
        run: |
          unzip -oq HT_SelectorGuard_v2_6_Notification_DirectMatch_Fix_OneUpload.zip
          test -f app/build.gradle
          test -f wear/build.gradle
          test -f signing/watch8-development.jks

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run JavaScript regression tests
        shell: bash
        run: |
          shopt -s nullglob
          for testfile in tests/*.test.js tests/selector/*.js tests/selector/*.cjs; do
            node "$testfile"
          done

      - name: Compile phone and watch APKs
        run: gradle :app:assembleDebug :wear:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: HT-v2.6-PHONE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Watch8 APK
        uses: actions/upload-artifact@v4
        with:
          name: HT-v2.6-WATCH8-APK
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
